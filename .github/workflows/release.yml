name: release
# Publishes io.hibira:hibira-ktor to Maven Central when a GitHub Release is
# published. The release tag (v0.1.0) sets the version.
#
# Secrets and variables (org level, Selected repositories):
#   vars.CENTRAL_TOKEN_USERNAME / secrets.CENTRAL_TOKEN_PASSWORD  central.sonatype.com user token
#   secrets.GPG_PRIVATE_KEY / secrets.GPG_PASSPHRASE               armored signing key
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Test, sign and publish
        run: ./gradlew --no-daemon -Pversion="${GITHUB_REF_NAME#v}" build publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ vars.CENTRAL_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
